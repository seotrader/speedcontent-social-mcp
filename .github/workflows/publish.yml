# Publishes to npm with a provenance attestation, then registers the release
# with the MCP Registry. Triggered by pushing a version tag, e.g. `git tag v0.1.0`.
#
# Provenance requires this workflow to be a Trusted Publisher on the npm package:
# npmjs.com -> package settings -> Publish access -> Trusted Publishers -> add
# this repo and `publish.yml`. Publishing from a laptop will not produce it.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for both npm provenance and MCP Registry OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Publish to the MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
